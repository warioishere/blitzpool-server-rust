# Blitzpool: a working Solo pool.
#
# Copy to simple-setup/blitzpool.toml and change every value marked CHANGE-ME.
# The host names (postgres, redis, bitcoin) match simple-setup/docker-compose.yml;
# see DEPLOYMENT.md for running without Docker or with your own node.
#
# Solo only: every block pays the miner who found it (minus the optional dev
# fee). PPLNS, Group-Solo and Blockparty are switched on by adding their
# sections; blitzpool.full.example.toml shows all of them.
#
# Process roles are not set here: each process gets them from
# BLITZPOOL_ROLES (the compose file does this) or --roles.

# mainnet | testnet | testnet4 | regtest. Must match the node.
network = "mainnet"
# Written into every coinbase scriptSig.
pool_identifier = "blitzpool"

# JSON-RPC to Bitcoin Core: submitblock fallback, chain reads.
[bitcoin_rpc]
url = "http://bitcoin"            # bundled node; your own node: http://host.docker.internal
port = 8332                       # mainnet 8332, testnet4 48332, regtest 18443
user = "blitzpool"                # rpcuser from bitcoin.conf
password = "CHANGE-ME"            # rpcpassword from bitcoin.conf

# Block templates come over Bitcoin Core 31's IPC socket (Template
# Distribution Protocol). The node must run as `bitcoin-node` (not bitcoind)
# with -ipcbind=unix:<path>; the compose file mounts that socket here.
[tdp]
socket_path = "/ipc/node.sock"

[database]
host = "postgres"
user = "postgres"
password = "postgres"             # = PG_PASSWORD in simple-setup/.env, if set there
database = "blitzpool"

[redis]
host = "redis"

[api]
port = 3334

# Both ports serve Stratum V1 and Stratum V2 on the same socket.
[stratum]
solo_port = 3333
solo_start_difficulty = 5000
solo_high_diff_port = 3339         # for large rigs and rented hashrate
high_diff_start_difficulty = 1000000
target_shares_per_minute = 15
high_diff_target_shares_per_minute = 10
difficulty_check_interval_ms = 240000

# Stratum V2 (Noise) identity. Required: the front refuses to start without it.
# Generate with `openssl rand -hex 32` and keep it: SV2 miners pin the public
# key derived from it, so a new key means reconfiguring every SV2 miner.
[sv2]
authority_privkey_hex = "CHANGE-ME"

# Optional pool fee on Solo blocks. Leave out for 100 % to the finder.
[solo]
# fee_address = "bc1q..."
# fee_percent = 1.0
