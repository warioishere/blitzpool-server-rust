[package]
name = "bp-coinbase-snapshot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Domain types of the shared weight build.
bp-common = { workspace = true }
bp-pplns = { workspace = true }
bp-share = { workspace = true }
bitcoin = { workspace = true }
# DbError, wrapped by the shared LedgerError.
bp-db = { workspace = true }

# Serde derives so the decoded coinbase can ride inside the block-found event.
serde = { workspace = true }
# Redis-backed coinbase-budget persistence.
redis = { workspace = true }
# sqlx::Error variant on the shared LedgerError.
sqlx = { workspace = true }

# Timeout on the coinbase-budget read.
tokio = { workspace = true, features = ["time"] }

# Observability + errors
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Async test runtime for the Redis-backed budget persistence tests.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
