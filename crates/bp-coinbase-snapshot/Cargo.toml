# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "bp-coinbase-snapshot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Domain types shared by the coinbase distribution snapshot.
bp-common = { workspace = true }
bp-pplns = { workspace = true }
# The one shared extras/claim projection both the build and the
# settlement read a weight snapshot through.
bp-share = { workspace = true }
bitcoin = { workspace = true }
# DbError, wrapped by the shared LedgerError.
bp-db = { workspace = true }

# Serde derives so the snapshot can ride inside the block-found event.
serde = { workspace = true }
# Redis-backed snapshot persistence.
redis = { workspace = true }
# sqlx::Error variant on the shared LedgerError.
sqlx = { workspace = true }

# Backoff between snapshot-write retries.
tokio = { workspace = true, features = ["time"] }

# The injected paid-address resolver is async (its production implementation
# reads `miner_identity` from Postgres).
async-trait = { workspace = true }

# Observability + errors
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Async test runtime for the Redis-backed budget persistence tests.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
# Real rotating identities for the `paid_at_height` tests. A DEV dependency on
# purpose: this crate renders a derived script to the address key it already
# builds, and never parses or stores a descriptor — the intake crate is needed
# to construct a `PayoutIdentity::Rotating` in a test, not to attribute one.
bp-payout-descriptor = { workspace = true }
# Round-trips the pending-block JSON blob, to pin that a snapshot still
# carrying the retired finder bonus is refused rather than silently
# stripped of it.
serde_json = { workspace = true }
