# Bitcoin Core 31 for the bundled node (docker compose --profile bitcoin).
# The pool reads block templates over the IPC socket the compose file binds
# (-ipcbind), and uses JSON-RPC only for one-shot calls.

server=1
# Must match [bitcoin_rpc] user / password in blitzpool.toml.
rpcuser=blitzpool
rpcpassword=CHANGE-ME

# Keep about 550 MiB of blocks. Set prune=0 for an archival node.
prune=550

[main]
rpcbind=0.0.0.0
rpcallowip=172.16.0.0/12
rpcallowip=192.168.0.0/16
rpcallowip=10.0.0.0/8

[test4]
rpcbind=0.0.0.0
rpcallowip=172.16.0.0/12
rpcallowip=192.168.0.0/16
rpcallowip=10.0.0.0/8

# BITCOIN_CHAIN=regtest: a private chain for trying the pool out.
[regtest]
rpcbind=0.0.0.0
rpcallowip=172.16.0.0/12
rpcallowip=192.168.0.0/16
rpcallowip=10.0.0.0/8
fallbackfee=0.0001
